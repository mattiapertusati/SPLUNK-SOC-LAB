title: Escalazione dei Privilegi in Locale
id: 52f71eb1-da22-4c5d-9073-eb52c9d4850d
status: experimental
description: Identifica l'aggiunta di utenti al gruppo locale Administrators per Privilege Escalation o persistenza.
author: Mattia
date: 2026/06/10
logsource:
    product: windows
    service: security
detection:
    selection_event_4732:
        EventID: 4732
        TargetUserName: 'Administrators'
    condition: selection_event_4732
falsepositives:
    - Promozione di account legittimi da parte degli amministratori.
    - Attività automatiche di strumenti di gestione dei privilegi (es. LAPS).
level: high
