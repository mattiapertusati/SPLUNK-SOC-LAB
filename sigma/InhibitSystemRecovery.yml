title: Inhibit System Recovery - Volume Shadow Copy Deletion
id: 78305a2e-defb-4109-9cdf-f6c17f86f2ff
status: experimental
description: Detects the execution of commands used to delete Volume Shadow Copies, a behavior commonly associated with ransomware.
author: Mattia
date: 2026/07/14
tags:
    - attack.impact
    - attack.t1490
logsource:
    category: process_creation
    product: windows
detection:
    selection_process:
        Image|endswith:
            - '\vssadmin.exe'
            - '\wmic.exe'
            - '\wbadmin.exe'
    selection_cli:
        CommandLine|contains|all:
            - 'delete'
            - 'shadow'
    condition: selection_process and selection_cli
falsepositives:
    - Scheduled disk cleanup tasks or system administrators (requires immediate investigation).
level: critical

