title: Detection of Anomalous Rundll32 Execution
id: f389f672-a38e-4f86-89de-c8d9f084987f
status: experimental
description: Identifies the execution of rundll32.exe from unusual paths or with suspicious parent processes (possible execution of malicious DLLs or droppers).
author: Mattia
date: 2026/07/20
tags:
    - attack.defense_evasion
    - attack.t1218.011
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith: '\rundll32.exe'
    filter_parent:
        ParentImage|endswith:
            - '\svchost.exe'
            - '\msiexec.exe'
            - '\explorer.exe'
    selection_commandline:
        CommandLine|contains:
            - '\Users\'
            - '\Temp\'
            - '\ProgramData\'
    condition: selection_image and selection_commandline and not filter_parent
fields:
    - Computer
    - User
    - CommandLine
    - ParentImage
    - ParentCommandLine
falsepositives:
    - Legitimate administrative activities or software installations.
level: medium

