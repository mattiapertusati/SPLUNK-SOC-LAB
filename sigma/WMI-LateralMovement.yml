title: Detection of Suspicious Processes Generated by WMI
id: fa62d227-7361-4530-a513-541c8adbbabc
status: experimental
description: Identifies the creation of unusual processes started by the WMI service, excluding legitimate system activity.
author: Mattia
date: 2026/07/09
tags:
  - attack.execution
  - attack.lateral_movement
  - attack.t1047
logsource:
product: windows
service: security
detection:
selection:
  EventID: 4688
  ParentProcessName|endswith: '\Windows\System32\wbem\WmiPrvSE.exe'
  filter_legitimate:
  NewProcessName|endswith:
    - '\System32\svchost.exe'
    - '\Program Files\Windows Defender\MsMpEng.exe'
condition: selection and not filter_legitimate
  fields:
    - Computer
    - User
    - CommandLine
    - ParentProcessName
    - TokenElevationType
falsepositives:
    - Legitimate administrative activity through WMI
level: medium
