title: Windows Firewall Disabling via Netsh or PowerShell
id: 71c283f3-508f-4e33-8671-c0e6f7482b3d
status: experimental
description: Detects attempts to disable or modify Windows Firewall profiles using the netsh utility or PowerShell modules.
author: Mattia Pertusati
date: 2026/06/10
logsource:
  category: process_creation
  product: windows
detection:
  selection_netsh_cmd:
    CommandLine|contains: 'advfirewall'
  selection_netsh_args:
    CommandLine|contains:
      - 'state off'
      - 'firewall set'
  selection_pwsh_cmd:
    CommandLine|contains: 'Set-NetFirewallProfile'
  selection_pwsh_args:
    CommandLine|contains: '-Enabled False'
  condition: (selection_netsh_cmd and selection_netsh_args) or (selection_pwsh_cmd and selection_pwsh_args)
falsepositives:
  - Manual emergency changes performed by system administrators during documented diagnostic activities.
level: high
tags:
  - attack.defense_evasion
  - attack.t1562.004
