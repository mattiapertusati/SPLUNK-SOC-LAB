title: Deactivation of Windows Defender
id: 256d9c68-dd5d-4344-a8db-9463b802de2e 
status: experimental
description: Identifies the deactivation of the native Windows security tool via PowerShell.
author: Mattia
date: 2026/06/10
logsource:
    product: windows
    service: powershell
detection:
    selection_event:
        EventID:
            - 4103
            - 4104
        ScriptBlockText|contains: 'Set-MpPreference'
    selection_regex:
        ScriptBlockText|re: '(?i)-DisableR(ealtimeMonitoring)?\s+(1|\$true)'
    condition: selection_event and selection_regex
falsepositives:
    - Legitimate interventions by IT administrators for testing or troubleshooting.
level: high
