title: Kerberos Ticket Detection with Weak Encryption (RC4)
id: e7dfb434-5de9-4393-8883-9f08fc019ac6
status: experimental
description: Detects Kerberos ticket (TGS) requests using weak RC4 encryption (0x17), excluding machine accounts.
references:
    - [https://mitre.org](https://mitre.org)
author: Mattia
date: 2026/06/22
tags:
    - attack.credential_access
    - attack.t1558.003
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4769
        TicketEncryptionType: '0x17'
    filter_machine_accounts:
        TargetUserName|endswith: '$'
    condition: selection and not filter_machine_accounts
falsepositives:
    - Legacy systems that do not support AES
    - Incorrect domain configurations
level: medium

