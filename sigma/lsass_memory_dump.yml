title: LSASS Memory Dumping via Comsvcs.dll
id: 4954f555-412d-4adb-8718-23a5b82320c4
status: experimental
description: Detects an attempt to dump the memory of the LSASS process using the MiniDump function of comsvcs.dll to extract credentials.
author: Mattia
date: 2026/06/10
modified: 2026/06/10
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  product: windows
  service: process_creation
detection:
  selection_comsvcs:
    CommandLine|contains: 'comsvcs.dll'
  selection_method:
    CommandLine|contains:
      - 'MiniDump'
      - '#24'
  condition: selection_comsvcs and selection_method
falsepositives:
  - Legitimate troubleshooting scripts or diagnostic tools used by administrators (very rare for LSASS)
level: critical
