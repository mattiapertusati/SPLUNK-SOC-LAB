title: Token Impersonation Detection - Special Privileges
id: 4709e6d1-3ff9-48d3-83d7-8c67d8c0cacb
status: experimental
description: Detects the assignment of special privileges (SeImpersonate, SeDebug, etc.) to non-standard users to identify Token Impersonation attempts.
author: Mattia
date: 2026/07/13
references:
- https://mitre.org
tags:
- attack.privilege_escalation
- attack.defense_evasion
- attack.t1134.001
logsource:
product: windows
service: security
detection:
selection:
EventID: 4672
PrivilegeList|contains:
- 'SeImpersonatePrivilege'
- 'SeAssignPrimaryTokenPrivilege'
- 'SeDebugPrivilege'
- 'SeTcbPrivilege'
filter_system:
SubjectUserName: 'SYSTEM'
filter_machine:
SubjectUserName|endswith: '$'
condition: selection and not 1 of filter_*
falsepositives:
- System backup and recovery software.
- Domain administrators performing advanced maintenance tasks.
level: high
