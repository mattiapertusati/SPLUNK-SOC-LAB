title: Local Account Creation for Persistence
id: 75e4d9cd-ea95-4bd8-a9a9-3d1813c269dc
status: experimental
description: Identifies the creation of local accounts through the native 4720 event or the execution of commands related to user management.
author: Mattia
date: 2026/06/10
logsource:
  product: windows
  service: security
detection:
  selection_event_4720:
    EventID: 4720
  selection_process_4688:
    EventID: 4688
    CommandLine|contains:
      - 'net user /add'
      - 'net1 user /add'
      - 'New-LocalUser'
  condition: selection_event_4720 or selection_process_4688
falsepositives:
  - Legitimate account creation (Onboarding).
  - Creation of temporary accounts with maximum privileges and a short expiration date for maintenance and/or urgent updates.
level: medium
