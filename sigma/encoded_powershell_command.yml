title: Detection of PowerShell with Encoded Command
id: d956cc48-354c-4eca-b186-3d839f27939a
status: experimental
description: Identifies the execution of PowerShell using the encoding parameter to hide the actual command.
author: Mattia
date: 2026/06/10
logsource:
category: process_creation
product: windows
detection:
    selection_process:
        - Image|endswith: '\powershell.exe'
        - OriginalFileName: 'PowerShell.EXE'
selection_regex:
    CommandLine|re: '(?i)[/-–—]e(n(c(o(d(e(d(c(o(m(m(a(n(d)? )? )? )? )? )? )? )? )? )? )? )?\b'
    condition: selection_process and selection_regex
    falsepositives:
        - Legitimate IT administration scripts
        - Third-party monitoring software that uses Base64 encoding to avoid formatting issues
level: high
