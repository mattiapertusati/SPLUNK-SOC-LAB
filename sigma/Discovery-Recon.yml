```yaml
title: Local and Domain Reconnaissance (Discovery)
id: c42a8b38-201a-4710-9c1b-4f7f6a0901e3
status: experimental
description: Detects the execution of multiple commands commonly used during the Discovery phase and domain reconnaissance activities (e.g., whoami, net user, nltest).
author: Mattia
date: 2026/08/13
tags:
  - attack.discovery
  - attack.ta0007
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'net user'
      - 'net group'
      - 'net localgroup'
      - 'whoami /all'
      - 'nltest /domain_trusts'
      - 'systeminfo'
  condition: selection
fields:
  - CommandLine
  - ParentCommandLine
  - User
  - Image
level: medium
```
