title: RDP Session Hijacking via Tscon Utility
id: b6bf32f7-48e5-4483-a1ec-dbba176a4ad9
status: experimental
description: Detects the abuse of the native tscon.exe utility to forcibly connect to existing or disconnected RDP sessions without re-entering credentials (using SYSTEM privileges).
author: Mattia Pertusati
date: 2026/06/10
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\tscon.exe'
    CommandLine|contains: '/dest:rdp-tcp'
  condition: selection
falsepositives:
  - Helpdesk or sysadmins managing locked remote user sessions.
level: high
tags:
  - attack.lateral_movement
  - attack.t1563.002
