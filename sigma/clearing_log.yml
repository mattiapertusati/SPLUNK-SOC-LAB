title: Cancellazione dei Registri Eventi di Windows
id: 20b6a8c6-cbf3-4c70-8561-6fbb86b001ad
status: experimental
description: Rileva il tentativo di cancellazione dei log di Sicurezza (1102) o di Sistema (104) per nascondere attività malevole.
author: Mattia
date: 2026/06/10
tags:
    - attack.defense_evasion
    - attack.t1070.001 
logsource:
    product: windows
    service: security
detection:
    sezione_EventoID:
        EventID:
            - 1102
            - 104
    condition: sezione_EventoID
falsepositives:
    - Attività di manutenzione legittima da parte degli amministratori di sistema (es. prima di creare una nuova immagine ISO o durante i test).
level: high
