[Detection 01 - Encoded PowerShell Command]
# 1. METADATA
description = Detects the execution of PowerShell with obfuscation and Base64 encoding parameters to hide malicious payloads.
search = index=wineventlog EventCode=4688 New_Process_Name="*powershell.exe" (Process_Command_Line="* -enc*" OR Process_Command_Line="* -e *" OR Process_Command_Line="* -encoded*") | table _time, host, Account_Name, New_Process_Name, Process_Command_Line

# 2. SCHEDULING
enableSched = 1

# 3. TRIGGER CONDITION
cron_schedule = */15 * * * * 
counttype = number of events
relation = greater than
quantity = 0

# 4. ACTION
action.email = 1
action.email.to = soc@yourcompany.com
action.email.subject = CRITICAL: Obfuscated PowerShell detected on host $result.host$

[Detection 02 - Local User Creation]
# 1. METADATA
description = Detects the creation of local accounts/users possibly created by the attacker to obtain persistence.
search = index=wineventlog EventCode=4720 | eval Creator_Account=mvindex(Account_Name, 0) | table _time, host, Creator_Account, SAM_Account_Name

# 2. SCHEDULING
enableSched = 1

# 3. TRIGGER CONDITION
cron_schedule = */15 * * * *
counttype = number of events
relation = greater than
quantity = 0

# 4. ACTION
action.email = 1
action.email.to = soc@yourcompany.com
action.email.subject = CRITICAL: Local Account detected on host $result.host$

[Detection 03 - Local Privilege Escalation]
# 1. METADATA
description = Detects the addition of administrator privileges to a local account created to obtain persistence.
search = index=wineventlog EventCode=4732 Group_Name=Administrators | eval Creator_Account=mvindex(Account_Name, 0) | eval Added_Account_SID=mvindex(Security_ID, 1) | table _time, host, Creator_Account, Group_Name, Added_Account_SID

# 2. SCHEDULING
enableSched = 1

# 3. TRIGGER CONDITION
cron_schedule = */15 * * * *
counttype = number of events
relation = greater than
quantity = 0

# 4. ACTION
action.email = 1
action.email.to = soc@yourcompany.com
action.email.subject = CRITICAL: Privilege Escalation detected on host $result.host$ for account $result.Added_Account_SID$

[Detection 04 - Windows Defender Evasion ]
# 1. METADATA
description = Detects the disabling of Windows real-time protection.
search = index=wineventlog source="*PowerShell*" (EventCode=4103 OR EventCode=4104) "Set-MpPreference" "DisableRealtimeMonitoring" | table _time, host, EventCode, Message

# 2. SCHEDULING
enableSched = 1

# 3. TRIGGER CONDITION
cron_schedule = */15 * * * *
counttype = number of events
relation = greater than
quantity = 0

# 4. ACTION
action.email = 1
action.email.to = soc@yourcompany.com
action.email.subject = CRITICAL: Disabled Windows Defender detected on host $result.host$

[Detection 05 - Scheduled Task Creation for Persistence ]
# 1. METADATA
description = Detects the creation of scheduled tasks at reboot for persistence by the attacker.
search = index=wineventlog EventCode=4698 | rex field=_raw "<Command>(?<Task_Command>[^<]+)</Command>" | table _time, host, Account_Name, Task_Name, Task_Command

# 2. SCHEDULING
enableSched = 1

# 3. TRIGGER CONDITION
cron_schedule = */15 * * * *
counttype = number of events
relation = greater than
quantity = 0

# 4. ACTION
action.email = 1
action.email.to = soc@yourcompany.com
action.email.subject = CRITICAL: Scheduled Task creation detected on host $result.host$

